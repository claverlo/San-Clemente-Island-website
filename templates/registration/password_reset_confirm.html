{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-panel"><div class="brand-mark large">SCI</div><p class="eyebrow dark">ACCOUNT RECOVERY</p>{% if validlink %}<h1>Set a new password</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-navy w-100">Set new password</button></form>{% else %}<h1>Link expired</h1><p class="small text-muted mb-3">This password reset link is invalid or has already been used. Request a new one below.</p><a class="btn btn-navy w-100" href="{% url 'password_reset' %}">Request a new link</a>{% endif %}</div></div>{% endblock %}
