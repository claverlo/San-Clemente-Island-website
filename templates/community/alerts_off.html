{% extends 'base.html' %}{% block content %}
<div class="auth-wrap"><div class="auth-panel">
	<div class="brand-mark large">SCI</div>
	<p class="eyebrow dark">EMAIL ALERTS</p>
	<h1>Turn off all alerts?</h1>
	<p class="small text-muted mb-3">{{ profile.user.email }} will stop getting emails about new posts. You can turn them back on any time from your dashboard.</p>
	<form method="post">{% csrf_token %}<button class="btn btn-navy w-100">Turn off all alerts</button></form>
</div></div>
{% endblock %}
