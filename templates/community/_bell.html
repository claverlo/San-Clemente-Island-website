<div class="nav-bell dropdown"><button class="nav-bell-button" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications{% if bell_count %}, {{ bell_count }}{% endif %}"><i class="bi bi-bell{% if bell_count %}-fill{% endif %}"></i>{% if bell_count %}<span class="nav-bell-count">{% if bell_count > 99 %}99+{% else %}{{ bell_count }}{% endif %}</span>{% endif %}</button><div class="dropdown-menu dropdown-menu-end nav-bell-menu"><div class="nav-bell-head"><strong>Notifications</strong>{% if bell_count %}<form method="post" action="{% url 'notifications_clear_all' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit">Clear all</button></form>{% endif %}</div>{% for note in bell_items %}<div class="nav-bell-item{% if not note.read %} unread{% endif %}"><a href="{% url 'notification_open' note.pk %}"><i class="bi {{ note.icon }}"></i><span><span class="nav-bell-text">{{ note.text }}</span><small>{{ note.created_at|timesince }} ago</small></span></a><form method="post" action="{% url 'notification_clear' note.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="nav-bell-clear" aria-label="Clear this notification" title="Clear"><i class="bi bi-x-lg"></i></button></form></div>{% empty %}<p class="nav-bell-empty"><i class="bi bi-bell-slash"></i> You're all caught up.</p>{% endfor %}<a class="nav-bell-all" href="{% url 'notifications' %}">See all notifications</a></div></div>
