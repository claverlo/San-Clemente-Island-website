<div class="nav-bell dropdown"><button class="nav-bell-button" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications{% if bell_unread %}, {{ bell_unread }} unread{% endif %}"><i class="bi bi-bell{% if bell_unread %}-fill{% endif %}"></i>{% if bell_unread %}<span class="nav-bell-count">{% if bell_unread > 99 %}99+{% else %}{{ bell_unread }}{% endif %}</span>{% endif %}</button><div class="dropdown-menu dropdown-menu-end nav-bell-menu"><div class="nav-bell-head"><strong>Notifications</strong>{% if bell_unread %}<form method="post" action="{% url 'notifications_read_all' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit">Mark all as read</button></form>{% endif %}</div>{% for note in bell_items %}<a class="nav-bell-item{% if not note.read %} unread{% endif %}" href="{% url 'notification_open' note.pk %}"><i class="bi {{ note.icon }}"></i><span><span class="nav-bell-text">{{ note.text }}</span><small>{{ note.created_at|timesince }} ago</small></span></a>{% empty %}<p class="nav-bell-empty"><i class="bi bi-bell-slash"></i> You're all caught up.</p>{% endfor %}<a class="nav-bell-all" href="{% url 'notifications' %}">See all notifications</a></div></div>
